# Fingerprints: what is in front of a website.
#
# Each signal has a weight: strong (0.7), medium (0.4), weak (0.15). Confidence for a
# technology is 1 - product(1 - weight) over the distinct signals seen, labelled
# high >= 0.8, medium >= 0.5, otherwise low. Only weak signals never exceed "low".
#
# Signal types:
#   header      name (+ optional regex on the value)    response header
#   cookie      name (prefix match)                      Set-Cookie name
#   body        regex                                    error page / HTML sample
#   tls_issuer  regex                                    certificate issuer
#   cname       suffix                                   CNAME target of apex or www
#   ip          cidrs                                    resolved address ranges
# Regexes are Go RE2 and case-insensitive.

- id: cloudflare
  kind: cdn
  name: Cloudflare
  signals:
    - {type: header, name: cf-ray, weight: strong}
    - {type: header, name: server, regex: '^cloudflare', weight: strong}
    - {type: header, name: cf-cache-status, weight: medium}
    - {type: cookie, name: __cf_bm, weight: medium}
    - {type: cookie, name: __cflb, weight: medium}
    - {type: body, regex: 'Cloudflare Ray ID|cf-error-details|cdn-cgi/styles/cf\.errors\.css', weight: strong}
    - {type: cname, suffix: .cdn.cloudflare.net, weight: strong}
    - type: ip
      weight: medium
      cidrs: [173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18,
              108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17,
              162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22,
              2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32,
              2a06:98c0::/29, 2c0f:f248::/32]

- id: cloudfront
  kind: cdn
  name: Amazon CloudFront
  signals:
    - {type: header, name: x-amz-cf-id, weight: strong}
    - {type: header, name: x-amz-cf-pop, weight: strong}
    - {type: header, name: via, regex: 'cloudfront', weight: strong}
    - {type: header, name: x-cache, regex: 'cloudfront', weight: medium}
    - {type: body, regex: 'Generated by cloudfront \(CloudFront\)', weight: strong}
    - {type: cname, suffix: .cloudfront.net, weight: strong}

- id: akamai
  kind: cdn
  name: Akamai
  signals:
    - {type: header, name: server, regex: '^AkamaiGHost|^AkamaiNetStorage', weight: strong}
    - {type: header, name: akamai-grn, weight: strong}
    - {type: header, name: x-akamai-transformed, weight: medium}
    - {type: header, name: akamai-cache-status, weight: strong}
    - {type: body, regex: 'Reference(&#32;| )(&#35;|#)\d+(\.|&#46;)[0-9a-f]+(\.|&#46;)\d+', weight: medium}
    - {type: cname, suffix: .edgekey.net, weight: strong}
    - {type: cname, suffix: .edgesuite.net, weight: strong}
    - {type: cname, suffix: .akamaiedge.net, weight: strong}

- id: fastly
  kind: cdn
  name: Fastly
  signals:
    - {type: header, name: x-fastly-request-id, weight: strong}
    - {type: header, name: x-served-by, regex: '^cache-[a-z]{3}', weight: medium}
    - {type: header, name: fastly-restarts, weight: strong}
    - {type: header, name: via, regex: 'varnish', weight: weak}
    - {type: body, regex: 'Fastly error', weight: medium}
    - {type: body, regex: 'Varnish cache server', weight: weak}   # any self-hosted Varnish says this too
    - {type: cname, suffix: .fastly.net, weight: strong}
    - {type: cname, suffix: .fastlylb.net, weight: strong}
    - type: ip
      weight: medium
      cidrs: [151.101.0.0/16, 199.232.0.0/16, 146.75.0.0/17, 23.235.32.0/20, 43.249.72.0/22,
              104.156.80.0/20, 140.248.64.0/18, 140.248.128.0/17, 157.52.64.0/18, 167.82.0.0/17,
              172.111.64.0/18, 185.31.16.0/22, 2a04:4e40::/32, 2a04:4e42::/32]

- id: sucuri
  kind: cdn
  name: Sucuri WAF
  signals:
    - {type: header, name: x-sucuri-id, weight: strong}
    - {type: header, name: x-sucuri-cache, weight: medium}
    - {type: header, name: server, regex: '^Sucuri', weight: strong}
    - {type: body, regex: 'Sucuri WebSite Firewall', weight: strong}
    - {type: ip, weight: medium, cidrs: [192.88.134.0/23, 185.93.228.0/22, 66.248.200.0/22]}

- id: imperva
  kind: cdn
  name: Imperva (Incapsula)
  signals:
    - {type: header, name: x-iinfo, weight: strong}
    - {type: header, name: x-cdn, regex: 'Incapsula|Imperva', weight: strong}
    - {type: cookie, name: incap_ses_, weight: medium}
    - {type: cookie, name: visid_incap_, weight: medium}
    - {type: body, regex: 'Incapsula incident ID|_Incapsula_Resource', weight: strong}
    - type: ip
      weight: medium
      cidrs: [45.60.0.0/16, 45.64.64.0/22, 107.154.0.0/16, 149.126.72.0/21, 192.230.64.0/18,
              199.83.128.0/21, 198.143.32.0/19]

- id: bunny
  kind: cdn
  name: Bunny CDN
  signals:
    - {type: header, name: server, regex: '^BunnyCDN', weight: strong}
    - {type: header, name: cdn-pullzone, weight: strong}
    - {type: header, name: cdn-requestid, weight: medium}
    - {type: cname, suffix: .b-cdn.net, weight: strong}

- id: google-cdn
  kind: cdn
  name: Google Cloud CDN / Load Balancer
  signals:
    - {type: header, name: via, regex: '^1\.1 google$', weight: medium}
    - {type: header, name: server, regex: '^Google Frontend$', weight: weak}
    - {type: header, name: x-goog-hash, weight: weak}
    - {type: body, regex: 'Error: Server Error.*The server encountered a temporary error', weight: weak}

- id: azure-frontdoor
  kind: cdn
  name: Azure Front Door
  signals:
    - {type: header, name: x-azure-ref, weight: strong}
    - {type: header, name: x-fd-healthprobe, weight: medium}
    - {type: header, name: x-msedge-ref, weight: medium}
    - {type: cname, suffix: .azurefd.net, weight: strong}
    - {type: cname, suffix: .azureedge.net, weight: strong}

# ---------- origin web servers ----------

- id: nginx
  kind: server
  name: nginx
  signals:
    - {type: header, name: server, regex: '^nginx', weight: strong}
    - {type: header, name: server, regex: '^openresty', weight: medium}
    - {type: body, regex: '<center>(nginx|openresty)(/[0-9.]+)?</center>', weight: strong}

- id: apache
  kind: server
  name: Apache httpd
  signals:
    - {type: header, name: server, regex: '^Apache', weight: strong}
    - {type: body, regex: '<address>Apache(/[0-9.]+)?', weight: strong}
    - {type: body, regex: 'Server at \S+ Port \d+', weight: strong}
    - {type: body, regex: 'You don''t have permission to access', weight: weak}

- id: litespeed
  kind: server
  name: LiteSpeed / OpenLiteSpeed
  signals:
    - {type: header, name: server, regex: '^(LiteSpeed|OpenLiteSpeed)', weight: strong}
    - {type: header, name: x-litespeed-cache, weight: strong}
    - {type: header, name: x-turbo-charged-by, regex: 'LiteSpeed', weight: strong}
    - {type: body, regex: 'LiteSpeed Web Server|Proudly powered by LiteSpeed', weight: strong}

- id: iis
  kind: server
  name: Microsoft IIS
  signals:
    - {type: header, name: server, regex: '^Microsoft-IIS', weight: strong}
    - {type: header, name: x-powered-by, regex: 'ASP\.NET', weight: medium}
    - {type: header, name: x-aspnet-version, weight: medium}
    - {type: body, regex: 'IIS Windows Server|Server Error in ''/'' Application|Internet Information Services', weight: medium}

- id: caddy
  kind: server
  name: Caddy
  signals:
    - {type: header, name: server, regex: '^Caddy', weight: strong}

# ---------- platforms / applications (best effort) ----------

- id: wordpress
  kind: platform
  name: WordPress
  signals:
    - {type: body, regex: '/wp-content/|/wp-includes/', weight: strong}
    - {type: body, regex: '<meta name="generator" content="WordPress', weight: strong}
    - {type: header, name: link, regex: 'api\.w\.org', weight: strong}
    - {type: cookie, name: wordpress_, weight: medium}

- id: laravel
  kind: platform
  name: Laravel
  signals:
    - {type: cookie, name: laravel_session, weight: strong}
    - {type: cookie, name: XSRF-TOKEN, weight: weak}

- id: nextjs
  kind: platform
  name: Next.js
  signals:
    - {type: header, name: x-powered-by, regex: 'Next\.js', weight: strong}
    - {type: header, name: x-nextjs-cache, weight: strong}
    - {type: body, regex: '__NEXT_DATA__|/_next/static/', weight: strong}

- id: drupal
  kind: platform
  name: Drupal
  signals:
    - {type: header, name: x-drupal-cache, weight: strong}
    - {type: header, name: x-generator, regex: 'Drupal', weight: strong}
    - {type: body, regex: 'drupal-settings-json|Drupal\.settings', weight: medium}

- id: joomla
  kind: platform
  name: Joomla
  signals:
    - {type: body, regex: '<meta name="generator" content="Joomla', weight: strong}

- id: shopify
  kind: platform
  name: Shopify
  signals:
    - {type: header, name: x-shopid, weight: strong}
    - {type: header, name: x-shopify-stage, weight: strong}
    - {type: body, regex: 'cdn\.shopify\.com', weight: medium}

- id: php
  kind: platform
  name: PHP
  signals:
    - {type: header, name: x-powered-by, regex: '^PHP', weight: medium}
    - {type: cookie, name: PHPSESSID, weight: medium}

- id: express
  kind: platform
  name: Node.js (Express)
  signals:
    - {type: header, name: x-powered-by, regex: '^Express', weight: medium}
