# CDN/WAF errors other than Cloudflare, generic CDN gateway errors, and the
# origin-direct comparison (the key signal for "CDN problem vs origin problem").

- id: cloudfront.origin-error
  title: CloudFront could not get a response from the origin
  layer: server
  severity: fail
  group: cdn-5xx
  match:
    all:
      - cdn: [cloudfront]
      - status: [502, 503, 504]
  confidence:
    base: 0.75
    boosts:
      - {when: {body: 'Generated by cloudfront'}, add: 0.1, why: "the error page was generated by CloudFront itself"}
      - {when: {body: 'CloudFront wasn.t able to connect to the origin'}, add: 0.1, why: "CloudFront says it could not connect to the origin"}
  verdict: "Amazon CloudFront could not get a valid response from your origin (HTTP {status})"
  causes:
    - {text: "502: CloudFront cannot complete a TLS connection to the origin (expired/mismatched origin certificate, unsupported protocol) or the origin closed the connection.", likelihood: high}
    - {text: "504: the origin did not answer within the CloudFront origin timeout (30 s default) or a security group blocks CloudFront.", likelihood: high}
    - {text: "503: the origin is overloaded or the CloudFront function/Lambda@Edge failed.", likelihood: medium}
  fixes:
    - step: "Check the origin domain name and protocol policy in the CloudFront distribution's Origin settings (HTTPS only requires a valid certificate matching the origin domain)."
      applies_to: [cloudfront]
      verify: "curl -sI https://<origin-domain>/ from outside AWS returns a normal status with a valid certificate."
    - step: "Allow CloudFront to reach the origin: security group / firewall must allow the CloudFront origin-facing managed prefix list on 443."
      applies_to: [cloudfront, firewall]
      verify: "The CloudFront error page disappears after the change."
    - step: "If responses are slow, raise the origin response timeout or fix the slow endpoint."
      applies_to: [cloudfront]
      verify: "The origin answers the same URL within the timeout."
  cannot_determine:
    - "The distribution's origin settings and security groups (in your AWS account)."
  tests:
    - name: cloudfront 502
      given: {status: 502, cdn: cloudfront, body: "<H1>502 ERROR</H1> The request could not be satisfied. CloudFront wasn't able to connect to the origin. Generated by cloudfront (CloudFront)"}
      expect: match
      min_confidence: 0.9

- id: cloudfront.403
  title: CloudFront blocked the request (403)
  layer: cdn
  severity: fail
  group: status-403
  priority: 1
  match:
    all:
      - cdn: [cloudfront]
      - status: [403]
      - body: 'Generated by cloudfront|The request could not be satisfied|Request blocked'
  confidence: {base: 0.8}
  verdict: "Amazon CloudFront refused the request (403) before it reached your origin"
  causes:
    - {text: "An AWS WAF rule or geographic restriction on the distribution blocks the request.", likelihood: high}
    - {text: "The hostname is not listed as an Alternate Domain Name (CNAME) on the distribution.", likelihood: medium}
    - {text: "An S3 origin denies access (missing Origin Access Control / bucket policy).", likelihood: medium}
  fixes:
    - step: "Check AWS WAF sampled requests and the distribution's Geographic restrictions."
      applies_to: [cloudfront]
      verify: "The request is allowed in WAF logs."
    - step: "Add {host} to the distribution's Alternate domain names with a matching ACM certificate."
      applies_to: [cloudfront]
      verify: "The site loads without the CloudFront 403 page."
  cannot_determine:
    - "WAF rules, geo restrictions and S3 bucket policies in your AWS account."
  tests:
    - name: cloudfront 403
      given: {status: 403, cdn: cloudfront, body: "403 ERROR The request could not be satisfied. Request blocked. Generated by cloudfront (CloudFront)"}
      expect: match

- id: akamai.reference-error
  title: Akamai edge error page (Reference #)
  layer: cdn
  severity: fail
  group: cdn-5xx
  match:
    all:
      - body: 'Reference(&#32;| )(&#35;|#)\d+(\.|&#46;)[0-9a-f]+(\.|&#46;)\d+'
    any:
      - cdn: [akamai]
      - body: 'Access Denied|You don.t have permission to access'
  confidence:
    base: 0.75
    boosts:
      - {when: {cdn: [akamai]}, add: 0.15, why: "Akamai detected in front of the site"}
  verdict: "Akamai's edge returned its own error page (HTTP {status}) — the request was blocked or the origin failed"
  causes:
    - {text: "403 'Access Denied' with a Reference number: an Akamai WAF/bot rule or a geo/IP block.", likelihood: high}
    - {text: "5xx with a Reference number: Akamai could not reach the origin or the origin certificate/hostname is wrong.", likelihood: high}
  fixes:
    - step: "Give the Reference number from the page to whoever manages the Akamai property; it identifies the exact edge decision in Akamai's logs."
      applies_to: [akamai]
      verify: "Akamai support or Control Center log lookup explains the decision."
    - step: "For 5xx, test the origin directly (origin IP test) and check the origin hostname/certificate configured in the property."
      applies_to: [akamai]
      verify: "The origin answers normally to a direct request with the right Host header."
  cannot_determine:
    - "The Akamai property configuration and the edge log entry for the Reference number."
  tests:
    - name: akamai 403
      given: {status: 403, cdn: akamai, body: "<H1>Access Denied</H1> You don't have permission to access ... Reference&#32;&#35;18&#46;2f3e4d5c&#46;1700000000&#46;abcdef"}
      expect: match
    - name: akamai reference plain
      given: {status: 503, cdn: akamai, body: "Reference #97.1f2e3d4c.1700000000.5a6b7c8"}
      expect: match

- id: fastly.error
  title: Fastly edge error
  layer: cdn
  severity: fail
  group: cdn-5xx
  match:
    all:
      - cdn: [fastly]
      - status_range: 500-599
  confidence:
    base: 0.7
    boosts:
      - {when: {body: 'unknown domain'}, add: 0.2, why: "Fastly does not know this hostname"}
      - {when: {body: 'backend read error|first byte timeout|connection timed out'}, add: 0.15, why: "Fastly reports an origin (backend) failure"}
  verdict: "Fastly returned an error (HTTP {status}) — either the hostname is not configured in Fastly or the origin (backend) failed"
  causes:
    - {text: "'Fastly error: unknown domain': the hostname is not added to an active Fastly service.", likelihood: high}
    - {text: "'backend read error' / 'first byte timeout': the origin was too slow or closed the connection.", likelihood: high}
    - {text: "The origin's TLS certificate does not match the hostname Fastly connects with.", likelihood: medium}
  fixes:
    - step: "If the page says 'unknown domain', add {host} to the Fastly service's Domains and activate the new version."
      applies_to: [fastly]
      verify: "The Fastly error page is replaced by your site."
    - step: "For backend errors, check the backend host, port, TLS settings and timeouts in the Fastly service, and test the origin directly."
      applies_to: [fastly]
      verify: "The origin answers within Fastly's first-byte timeout."
  cannot_determine:
    - "The Fastly service configuration and backend health checks."
  tests:
    - name: fastly unknown domain
      given: {status: 500, cdn: fastly, body: "Fastly error: unknown domain: example.com"}
      expect: match
      min_confidence: 0.85

- id: sucuri.block
  title: Sucuri firewall blocked the request
  layer: cdn
  severity: fail
  group: status-403
  priority: 1
  match:
    all:
      - status: [403]
      - body: 'Sucuri WebSite Firewall|Access Denied - Sucuri'
  confidence:
    base: 0.85
    boosts:
      - {when: {cdn: [sucuri]}, add: 0.1, why: "Sucuri detected in front of the site"}
  verdict: "The Sucuri Website Firewall blocked the request before it reached your server"
  causes:
    - {text: "A Sucuri security rule, country block or IP blacklist matched this client.", likelihood: high}
  fixes:
    - step: "In the Sucuri dashboard → Firewall → Audit Trails, find the block (the page shows a Block ID) and allowlist the path/IP if it is legitimate."
      applies_to: [sucuri]
      verify: "The same request is allowed."
  cannot_determine:
    - "The Sucuri rule and country settings in your account."
  tests:
    - name: sucuri block page
      given: {status: 403, cdn: sucuri, body: "Access Denied - Sucuri Website Firewall"}
      expect: match

- id: imperva.block
  title: Imperva (Incapsula) blocked the request
  layer: cdn
  severity: fail
  group: status-403
  priority: 1
  match:
    all:
      - body: 'Incapsula incident ID|Request unsuccessful\. Incapsula'
  confidence: {base: 0.9}
  verdict: "Imperva (Incapsula) blocked the request and showed an incident page"
  causes:
    - {text: "An Imperva WAF/bot rule, IP reputation or country block matched this client.", likelihood: high}
  fixes:
    - step: "Look up the Incident ID from the page in the Imperva Security Events and add an exception for legitimate traffic."
      applies_to: [imperva]
      verify: "The same request is allowed."
  cannot_determine:
    - "Your Imperva security policy."
  tests:
    - name: incapsula incident
      given: {status: 200, cdn: imperva, body: "Request unsuccessful. Incapsula incident ID: 1234-5678"}
      expect: match

- id: cdn.gateway-error
  title: CDN gateway error (502/504) — origin not reachable through the CDN
  layer: server
  severity: fail
  group: cdn-5xx
  priority: 5
  match:
    all:
      - status: [502, 504]
      - cdn: [any]
    none:
      - cdn: [cloudfront, fastly]    # their own error pages have dedicated rules
  confidence:
    base: 0.65
    boosts:
      - {when: {signal: origin_ok_cdn_fail}, add: 0.2, why: "the origin answers directly, so the CDN-to-origin path is the problem"}
      - {when: {signal: origin_fail_too}, add: 0.2, why: "the origin also fails directly"}
  verdict: "{cdn} cannot get a response from your origin server (HTTP {status})"
  causes:
    - {text: "The origin is down or too slow (504) or returned an invalid response (502).", likelihood: high}
    - {text: "The CDN connects over HTTPS and the origin certificate is invalid, expired or for another name.", likelihood: medium}
    - {text: "The origin firewall does not allow the CDN's IP ranges on port 443.", likelihood: medium}
  fixes:
    - step: "Check that the origin is reachable on port 443 with a valid certificate for {host}."
      snippets:
        any: "openssl s_client -connect ORIGIN_IP:443 -servername {host} </dev/null | head -20\ncurl -sv --resolve {host}:443:ORIGIN_IP https://{host}/ -o /dev/null"
      verify: "The handshake completes and curl gets an HTTP status. With a CDN-issued origin certificate (e.g. Cloudflare Origin CA), 'unable to get local issuer certificate' is expected; check the dates and names instead."
    - step: "Allow the CDN's published IP ranges in the origin firewall."
      applies_to: [firewall]
      verify: "Requests from the CDN reach the origin access log."
    - step: "Raise the origin timeout in the CDN only after fixing slow requests."
      verify: "The page responds within the CDN timeout."
  cannot_determine:
    - "The CDN's origin configuration and its own logs."
    - "Origin logs showing whether the CDN's requests arrived."
  tests:
    - name: generic cdn 502 with origin ok
      given: {status: 502, cdn: bunny, signals: [origin_ok_cdn_fail]}
      expect: match
      min_confidence: 0.85
    - name: no cdn
      given: {status: 502, cdn: none}
      expect: no_match

- id: cdn.origin-direct-ok
  title: The origin works directly but fails through the CDN
  layer: cdn
  severity: fail
  group: origin-compare
  match:
    all:
      - signal: origin_ok_cdn_fail
      - cdn: [any]
  confidence: {base: 0.85}
  verdict: "Your origin server answers correctly when contacted directly, but the site fails through {cdn}: the problem is in the CDN configuration or the CDN-to-origin path"
  causes:
    - {text: "The CDN connects with a protocol/port the origin does not serve (e.g. HTTPS to an HTTP-only origin).", likelihood: high}
    - {text: "The origin firewall allows your IP but blocks the CDN's IP ranges.", likelihood: high}
    - {text: "The CDN points to an old origin IP or hostname.", likelihood: medium}
  fixes:
    - step: "Compare the CDN's origin settings (address, port, protocol, Host header) with what worked in the origin-direct test."
      verify: "The CDN origin settings match the working direct request."
    - step: "Allow the CDN's IP ranges on the origin firewall."
      applies_to: [firewall]
      verify: "The site loads through the CDN."
  cannot_determine:
    - "The CDN's internal origin configuration."
  tests:
    - name: origin ok cdn fail
      given: {status: 502, cdn: cloudflare, signals: [origin_ok_cdn_fail]}
      expect: match

- id: cdn.origin-fails-too
  title: The origin fails even when contacted directly
  layer: server
  severity: fail
  group: origin-compare
  match:
    all:
      - signal: origin_fail_too
  confidence: {base: 0.85}
  verdict: "Your origin server fails even when contacted directly, so the problem is the origin itself, not {cdn}"
  causes:
    - {text: "The web server or application on the origin is down or misconfigured.", likelihood: high}
    - {text: "The origin IP you supplied is not the server that hosts this site.", likelihood: medium}
  fixes:
    - step: "Fix the origin first (web server running, correct virtual host, valid certificate); the CDN errors will disappear with it."
      verify: "A direct request with the right Host header returns 200."
  cannot_determine:
    - "Whether the supplied origin IP is really this site's origin."
  tests:
    - name: origin fails too
      given: {status: 521, cdn: cloudflare, signals: [origin_fail_too]}
      expect: match

- id: cdn.waf-ua-block
  title: The CDN/WAF blocks some User-Agents
  layer: cdn
  severity: warn
  group: ua-block
  match:
    all:
      - signal: ua_dependent_block
      - cdn: [any]
  confidence: {base: 0.75}
  verdict: "{cdn} answers browsers but blocks other clients (curl or search-engine bots)"
  causes:
    - {text: "A bot-management or WAF rule blocks non-browser User-Agents.", likelihood: high}
    - {text: "A rule meant for scrapers also catches monitoring tools or search engines.", likelihood: medium}
  fixes:
    - step: "Review the CDN's bot/WAF settings and allow verified bots (search engines) and your monitoring."
      applies_to: [cloudflare, akamai, imperva, sucuri, cloudfront, fastly]
      verify: "Requests with the Googlebot-like User-Agent are allowed; real Googlebot can crawl (check Search Console)."
  warnings:
    - "Blocking unverified clients can be intended. Only change the rule if you need those clients."
  cannot_determine:
    - "Whether the CDN verifies real Googlebot by reverse DNS (our test UA is not a real Googlebot)."
  tests:
    - name: ua block behind cdn
      given: {status: 200, cdn: cloudflare, signals: [ua_dependent_block]}
      expect: match
