  cannot_determine:
    - "The application code that builds the URL."
  tests:
    - name: 414
      given: {status: 414}
      expect: match

- id: http.429
  title: 429 Too Many Requests from the origin
  layer: application
  severity: warn
  match:
    all:
      - status: [429]
    none:
      - body: 'Error 1015|error code: 1015|You are being rate limited'   # Cloudflare's page is cf.1015
  confidence:
    base: 0.75
    boosts:
      - {when: {signal: retry_after}, add: 0.1, why: "the server says when to retry"}
  verdict: "The site is rate limiting requests (429 Too Many Requests)"
  causes:
    - {text: "A rate limit in the web server, application or security plugin is too low or shared by many users behind one IP.", likelihood: high}
    - {text: "The hosting account hit its resource limits (shared hosting).", likelihood: medium}
  fixes:
    - step: "Review rate-limit settings and set them per client with sensible bursts."
      snippets:
        nginx: "limit_req_zone $binary_remote_addr zone=site:10m rate=20r/s;\nlimit_req zone=site burst=40 nodelay;"
      verify: "Normal browsing does not trigger 429."
  cannot_determine:
    - "Whether the limit applies only to our measurement nodes."
  tests:
    - name: 429
      given: {status: 429, signals: [retry_after]}
      expect: match
