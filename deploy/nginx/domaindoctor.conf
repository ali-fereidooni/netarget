# /etc/nginx/sites-available/domaindoctor.conf
# Example values only — tune limits for your traffic.
limit_req_zone $binary_remote_addr zone=dd_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name doctor.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name doctor.example.org;

    ssl_certificate     /etc/letsencrypt/live/doctor.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doctor.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 16k;

    location / {
        limit_req zone=dd_api burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (do not append to) any client-supplied header: with
        # TRUSTED_PROXY_HOPS=1 the master trusts exactly this one entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: progress, traceroute
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
