# netarget.ir behind the ParsPack CDN -> netarget master container (127.0.0.1:8082).
# 443 uses a self-signed origin certificate; visitors see the ParsPack
# certificate. firewalld lets only ParsPack reach 443.

log_format netarget_cdn '$remote_addr peer=$realip_remote_addr xri="$http_x_real_ip" '
                        'host=$host "$request" $status $body_bytes_sent';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ParsPack connects to the origin over HTTP for every visitor and sends no
# scheme header, so CDN requests on port 80 are served (redirecting them would
# loop). Direct, non-CDN requests are redirected to HTTPS. Set the ParsPack
# origin protocol to HTTPS and enable its HTTP-to-HTTPS redirect for a full redirect.
geo $realip_remote_addr $from_parspack {
    default 0;
    include /etc/nginx/parspack-geo.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name netarget.ir www.netarget.ir;
    include /etc/nginx/parspack-realip.conf;
    real_ip_header X-Real-IP;
    access_log /var/log/nginx/netarget.access.log netarget_cdn;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        if ($from_parspack = 0) {
            return 301 https://netarget.ir$request_uri;
        }
        if ($host = www.netarget.ir) {
            return 301 https://netarget.ir$request_uri;
        }
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host netarget.ir;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.netarget.ir;
    ssl_certificate     /etc/nginx/ssl/netarget.ir.crt;
    ssl_certificate_key /etc/nginx/ssl/netarget.ir.key;
    return 301 https://netarget.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name netarget.ir;

    ssl_certificate     /etc/nginx/ssl/netarget.ir.crt;
    ssl_certificate_key /etc/nginx/ssl/netarget.ir.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Visitor IP from ParsPack only (https://parspack.com/cdnips.txt).
    include /etc/nginx/parspack-realip.conf;
    real_ip_header X-Real-IP;

    access_log /var/log/nginx/netarget.access.log netarget_cdn;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the master trusts exactly this one hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Server-Sent Events: check progress, traceroute
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
