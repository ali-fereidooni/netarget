# Edge: TLS termination and routing by host name. Upstream Server headers
# and error pages pass through unchanged so the origin is fingerprintable.
map $host $demo_upstream {
    default                       apache:80;
    healthy.ddemo-site.com        apache:80;
    apache-403.ddemo-site.com     apache:80;
    apache-500.ddemo-site.com     apache:80;
    nginx-502.ddemo-site.com      origin:80;
    nginx-503.ddemo-site.com      origin:80;
    waf-403.ddemo-site.com        origin:80;
    mixed.ddemo-site.com          origin:80;
    cdn-525.ddemo-site.com        cdn:80;
    cdn-521.ddemo-site.com        cdn:80;
    cdn-loop.ddemo-site.com       cdn:80;
}

server {
    listen 80;
    server_name _;
    # Plain HTTP redirects to HTTPS, except the fake-CDN loop host (it loops by itself).
    location / {
        if ($host != "cdn-loop.ddemo-site.com") {
            return 301 https://$host$request_uri;
        }
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://$demo_upstream;
        proxy_set_header Host $host;
        proxy_pass_header Server;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /certs/demo.crt;
    ssl_certificate_key /certs/demo.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location / {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://$demo_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_header Server;
    }
}
