# nginx "origin" for the demo: a dead upstream (502), maintenance (503),
# a User-Agent block (WAF-like 403) and a page with mixed content.

server {
    listen 80;
    server_name nginx-502.ddemo-site.com;
    location / {
        # Nothing listens here: nginx answers 502 Bad Gateway.
        proxy_pass http://127.0.0.1:9;
    }
}

server {
    listen 80;
    server_name nginx-503.ddemo-site.com;
    root /usr/share/nginx/demo;
    error_page 503 /maintenance.html;
    location = /maintenance.html { internal; add_header Retry-After 120 always; }
    location / { return 503; }
}

server {
    listen 80;
    server_name waf-403.ddemo-site.com;
    root /usr/share/nginx/demo;
    location / {
        # Deliberate bot block: command-line clients and crawlers get 403.
        if ($http_user_agent ~* "(curl|Googlebot)") { return 403; }
        add_header Strict-Transport-Security "max-age=86400" always;
        try_files /waf.html =404;
    }
}

server {
    listen 80;
    server_name mixed.ddemo-site.com;
    root /usr/share/nginx/demo;
    location = / { try_files /mixed.html =404; }
    location / { try_files $uri =404; }
}
