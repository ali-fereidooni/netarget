# Minimal Apache 2.4 for the demo: one healthy site, one denied by
# .htaccess (403), one with a broken .htaccess (500).
ServerRoot "/usr/local/apache2"
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
User daemon
Group daemon
ServerName localhost
ServerTokens Prod
ServerSignature On
ErrorLog /proc/self/fd/2
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common
TypesConfig conf/mime.types
DirectoryIndex index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/usr/local/apache2/sites">
    AllowOverride All
    Require all granted
</Directory>

<VirtualHost *:80>
    ServerName healthy.ddemo-site.com
    DocumentRoot /usr/local/apache2/sites/healthy
    Header always set Strict-Transport-Security "max-age=86400"
    Header always set Content-Security-Policy "default-src 'self'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>

<VirtualHost *:80>
    ServerName apache-403.ddemo-site.com
    DocumentRoot /usr/local/apache2/sites/forbidden
</VirtualHost>

<VirtualHost *:80>
    ServerName apache-500.ddemo-site.com
    DocumentRoot /usr/local/apache2/sites/broken
</VirtualHost>
